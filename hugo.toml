# ---------------------------------------------------------------------------
# Hugo configuration
# Docs: https://gohugo.io/configuration/
#
# CUSTOMISE: almost everything you need for a basic site is in this one file.
# Change a value, save, and `hugo server` reloads the browser instantly.
# ---------------------------------------------------------------------------

# CUSTOMISE (REQUIRED): this must match where the site is actually served from,
# or your CSS and links will 404 once deployed.
#
#   Project site (repo named anything, e.g. github.com/you/my-site):
baseURL = "https://open-source-practices.github.io/"  
#  trailing slash matters
#   Custom domain (also add a static/CNAME file containing the bare domain):
#     baseURL = "https://example.org/"
# Add a theme
# Tells Hugo to use the theme in themes/terminal.
theme = "terminal"

locale = "en-GB"                 # CUSTOMISE: "en-US", "fr-FR", etc. Sets date and number formatting.
defaultContentLanguage = "en"

enableRobotsTXT = true
enableGitInfo = false           # set true to use git commit dates as page dates
timeZone = "America/New_York"      # CUSTOMISE: used when rendering dates

# Drop pages dated in the future or marked draft: true out of production builds.
buildDrafts = false
buildFuture = false

# CUSTOMISE: how many posts per page before pagination kicks in.
[pagination]
  pagerSize = 5

# ---------------------------------------------------------------------------
# Theme behaviour
# ---------------------------------------------------------------------------
[params]
  # Folder under content/ holding your posts. The homepage lists whatever is
  # in here. CUSTOMISE: change to "notes", "writing" etc., and rename the
  # content/posts/ folder to match.
  contentTypeName = "posts"

  # How many menu items show before the rest collapse behind "Show more".
  # Set to 0 to hide all items behind the toggle.
  showMenuItems = 3

  showLanguageSelector = false   # only useful if you add a second language

  fullWidthTheme = false         # true = content spans the full window width
  centerTheme = true             # true = content column centred rather than left

  # If a post is a folder (content/posts/my-post/index.md) containing
  # cover.jpg|png|webp, that image is used as the post cover automatically.
  autoCover = true

  showLastUpdated = false        # requires enableGitInfo = true above
  # updatedDatePrefix = "Updated"

  readingTime = false             # show "N min read" on posts
  Toc = false                    # table of contents; override per post in front matter
  TocTitle = "Contents"

  # CUSTOMISE: date format. "2006-01-02" is Go's reference date, not a literal
  # year.
  dateFormat = "2006-01-02"

# ---------------------------------------------------------------------------
# Your own variables. Anything under [params] is available in templates as
# {{ .Site.Params.something }}. Grep the layouts/ folder for `Params` to see
# where each of these is used.
# ---------------------------------------------------------------------------
[params]
  # CUSTOMISE: footer links. Add or delete entries freely; the footer loops
  # over whatever is here.
  [[params.social]]
    name = "Email"
    url = "mailto:ariellebennettlovell@gmail.com"
  [[params.social]]
    name = "GitHub"
    url = "https://github.com/Arielle-Bennett"
  [[params.social]]
    name = "Blue Sky"
    url = "https://bsky.app/profile/arielleb.bsky.social"
  [[params.social]]
    name = "RSS"
    url = "/index.xml"
# ---------------------------------------------------------------------------
# Language block: site title, all interface wording, logo and menu.
# This is where most of your customising happens.
# ---------------------------------------------------------------------------
[languages]
  [languages.en]
    # CUSTOMISE: shown in the browser tab, the RSS feed and the header wordmark.
    title = "From Open Code to Open Contributions"
    # CUSTOMISE: one line under the site name on the homepage, and the meta description search engines show.
    subtitle = "Exploring open source culture in academia, a Research Software Institute Fellowship Project"

    author = "Arielle Bennett"        # CUSTOMISE: used in the footer and RSS
    copyright - ""
    copyrightYear = "2026"            # CUSTOMISE
    showReadingTime = false           # set false to hide "N min read" on posts
    # CUSTOMISE: interface wording. Change any of these to reword the site.
    menuMore = "Show more"
    readMore = "Read more"
    readOtherPosts = "Read other posts"
    newerPosts = "Newer posts"
    olderPosts = "Older posts"
    missingContentMessage = "Page not found..."
    missingBackButtonLabel = "Back to home page"
    minuteReadingTime = "min read"
    words = "words"
    
    # CUSTOMISE: the wordmark in the top left. Plain text, styled by the
    # theme to look like a terminal prompt.
    [languages.en.params.logo]
    logoText = "From Code to Contributions"
        # logoHomeLink is deliberately left out. The theme uses this value
        # verbatim as the wordmark's link, so setting it to "/" sends visitors
        # to the domain root, which is a 404 on a project site served at
        # username.github.io/your-repo/. Left unset, the theme falls back to
        # your baseURL, which is correct for every kind of Pages site.
        # Only set it if you want the wordmark to point somewhere unusual.
        # logoHomeLink = "https://example.org/"

# ---------------------------------------------------------------------------
# Navigation
# CUSTOMISE: add, remove or reorder items. `weight` controls left-to-right order.
# `pageRef` points at a content path; use `url` instead for external links.
# ---------------------------------------------------------------------------
      [languages.en.menu]
        [[languages.en.menu.main]]
          identifier = "about"
          name = "About"
          url = "/about"
       [[languages.en.menu.main]]
          identifier = "from-code-to-contributions"
          name = "From Code to Contributions"
          url = "/posts" 
      [[languages.en.menu.main]]
          identifier = "materials"
          name = "Materials & Other Downloads"
          url = "/materials" 
       [[languages.en.menu.main]]
          identifier = "contact"
          name = "Say Hello"
          url = "mailto:ariellebennettlovell@gmail.com" 

        # Example external link. Uncomment and edit.
        # [[languages.en.menu.main]]
        #   identifier = "github"
        #   name = "GitHub"
        #   url = "https://github.com/YOUR-USERNAME"

# ---------------------------------------------------------------------------
# Markdown rendering. Leave these alone unless you hit a specific need.
# ---------------------------------------------------------------------------
[markup]
  [markup.goldmark.renderer]
    unsafe = true                   # allows raw HTML inside your Markdown files
  [markup.highlight]
    noClasses = false               # syntax highlighting follows the CSS, not a hardcoded theme
    lineNos = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
