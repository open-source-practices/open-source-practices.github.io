project:
  id: e0779188-e2f3-4b52-b31d-0e5ab7b39a69
  title: From Code to Contributions - Open Source Culture in Academia
  description: Currently, open source plays a critical role in research software, and is mandated by some funding sources. However, these mandates vary widely in their clarity around exactly how they support open source and currently they are very focused on publishing code openly, rather than saupporting and recognising contributions to maintaining existing open source projects. There are several groups across academia that are already encouraging people to support this maintenance activity which is critical for many open source research tools. This project intends to start asking the question "How to encourage more researchers and RSEs towards actively contributing to open source projects?"
  keywords: 
   - open-source
   - contributing
   - research-culture
  authors: 
   - name: Arielle Bennett
     roles: 
     - Conceptualization
     - Investigation
     - Writing - original draft 
